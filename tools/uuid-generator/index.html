<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID Generator — Toolbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="tool-header">
    <div class="container">
      <a href="../../" class="back-link">← <span>Toolbox</span></a>
      <h1>UUID Generator</h1>
    </div>
  </header>

  <main class="tool-body">
    <div class="container">
      <div class="uuid-workspace">
        <div class="generator-controls">
          <div class="form-group">
            <label>How many?</label>
            <input type="number" id="num-uuids" value="1" min="1" max="100" class="form-input">
          </div>
          <button class="btn btn-primary btn-lg" id="btn-generate">Generate UUID(s)</button>
        </div>

        <div class="output-pane">
          <div class="pane-header">
            <h3>Generated UUIDs (v4)</h3>
            <div class="actions">
              <button class="btn btn-secondary btn-sm" id="btn-copy">Copy All</button>
            </div>
          </div>
          <textarea id="uuid-output" readonly placeholder="Your UUIDs will appear here..." wrap="off"></textarea>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Open-source tools for developers and everyday tasks. Client-side processing only.
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
